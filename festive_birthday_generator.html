
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🎉 Funny Birthday Generator 🎂</title>
<style>
    body {
        margin: 0;
        font-family: 'Comic Sans MS', 'Trebuchet MS', sans-serif;
        background: linear-gradient(135deg, #ff9a9e, #fad0c4, #fbc2eb);
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
    }

    .card {
        background: white;
        padding: 30px;
        border-radius: 25px;
        box-shadow: 0 15px 30px rgba(0,0,0,0.2);
        text-align: center;
        max-width: 400px;
        width: 90%;
        position: relative;
        overflow: hidden;
    }

    h1 {
        color: #ff4d6d;
        margin-bottom: 10px;
    }

    input {
        width: 90%;
        padding: 12px;
        margin: 8px 0;
        border-radius: 10px;
        border: 1px solid #ddd;
        font-size: 16px;
    }

    button {
        background: #ff4d6d;
        color: white;
        border: none;
        padding: 12px 25px;
        border-radius: 20px;
        font-size: 18px;
        cursor: pointer;
        margin-top: 10px;
        transition: 0.2s;
    }

    button:hover {
        background: #ff1f4b;
        transform: scale(1.05);
    }

    #output {
        margin-top: 20px;
        font-size: 18px;
        color: #333;
        min-height: 60px;
    }

    .confetti {
        position: absolute;
        width: 10px;
        height: 10px;
        background: red;
        animation: fall 5s linear infinite;
        opacity: 0.7;
    }

    @keyframes fall {
        0% { transform: translateY(-10px) rotate(0deg); }
        100% { transform: translateY(500px) rotate(360deg); }
    }
</style>
</head>

<body>

<div class="card">
    <h1>🎂 Birthday Card Generator 🎉</h1>
    <p>Enter details and get a funny wish!</p>

    <input id="name" placeholder="Name">
    <input id="hobby" placeholder="Hobby">
    <input id="age" placeholder="Age">

    <br>
    <button onclick="generate()">Generate 🎈</button>

    <div id="output"></div>
</div>

<script>
function generate() {
    const name = document.getElementById("name").value || "Legend";
    const hobby = document.getElementById("hobby").value || "having fun";
    const age = document.getElementById("age").value || "forever 21";

    const templates = [
        `🎉 Happy ${age}th Birthday, ${name}! May your love for ${hobby} keep you young and slightly irresponsible 😆`,
        `${name}, level ${age} unlocked! New skill: doing ${hobby} with style and back pain 😂`,
        `At ${age}, ${name}, your passion for ${hobby} is impressive and mildly suspicious 😜`,
        `Happy Birthday ${name}! May ${hobby} bring joy, laughs, and minimal injuries this year 🎂`
    ];

    const msg = templates[Math.floor(Math.random() * templates.length)];
    document.getElementById("output").innerText = msg;

    launchConfetti();
}

function launchConfetti() {
    for(let i = 0; i < 30; i++) {
        const confetti = document.createElement("div");
        confetti.className = "confetti";
        confetti.style.left = Math.random() * window.innerWidth + "px";
        confetti.style.backgroundColor = randomColor();
        confetti.style.animationDuration = (Math.random() * 3 + 2) + "s";
        document.body.appendChild(confetti);

        setTimeout(() => confetti.remove(), 5000);
    }
}

function randomColor() {
    const colors = ["#ff4d6d", "#ffd166", "#06d6a0", "#118ab2", "#9b5de5"];
    return colors[Math.floor(Math.random() * colors.length)];
}
</script>

</body>
</html>
